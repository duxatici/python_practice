services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: asyncio_test
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - ./data:/var/lib/postgresql/data

  redis:
    image: redis:latest
    ports:
     - "6379:6379"

  app:
    build: .
    container_name: app
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
