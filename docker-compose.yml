services:
  db:
    image: postgres:16-alpine
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  app:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    env_file: .env

  worker:
    build: .
    command: poetry run celery -A youtube worker -l INFO
    depends_on:
      - redis
      - db
    env_file: .env

volumes:
  pg_data:
